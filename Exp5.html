<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset> <center>
<h1> Student Registration Form</h1> </center>
<hr>
<form action="./submit.html" align="centre" name="Student Registration Form" target="#" method="post">
    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your full name" required >
   <br /><br />

   <label for="email">Email:</label>
   <input type="email" name="email" id="email" placeholder="Enter valid email address" required >
<br><br>

<label for="password">Password:</label>
<input type="pass" name="pass" id="pass" placeholder="Enter password" required >
<br><br>


<label for="Gender">Gender:</label>

<input type="radio" name="gender" id="gender" required>
 <label for="gender">Male</label>
 <input type="radio" name="gender" id="gender">
 <label for="gender">Female</label>
 <input type="radio" name="guender" id="gender">
 <label for="geender">Others</label>
<br><br>

<label for="course">Course:</label>
<select name="select course" id="select course" required>
<option value="select course">--Select Course--</option>
    <option value="Mathematics">Mathemaics</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="Science">Science</option>
    <option value="Web Designing">Web Designing</option>
</select>
<br><br>

 <label for="contact no.">Contact:</label>
    <input type="tel" name="contact no." id="contact no." placeholder="Enter phone number" required>
    <br><br>



    <label for="Address">Address:</label> <br>
    <textarea name="Address" id="Address" placeholder="Enter your address"  required></textarea>
    <br><br>



    <button>Register</button> <button>Clear</button>
<hr>
<center>
    <p>&copy; 2025 Student Registration Portal</p>
</center>
</form>

</fieldset>
</body>
</html>
