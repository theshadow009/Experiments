<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>

    <fieldset>
        <h1>Hotel Room Booking Form </h1>

        <form action="#" name="Hotel Room Booking Form" target="#" method="get">
            <label for="name"><b>Full Name: </b></label>
            <input type="text" name="name" id="name" placeholder="" required>
            <br><br>

            <label for="email"><b>Email: </b></label>
            <input type="email" name="email" id="email" placeholder="" required>
            <br><br>

            <label for="phone"><b>Phone:</b></label>
            <input type="number" name="phone" id="phone" placeholder="" required>
            <br><br>

             <label for="Check-in Date"><b>Check-in Date: </b></label>
             <input type="date" name="check-in date" id="check-in date" required>
             <br><br>

              <label for="Check-out Date"><b>Check-out Date: </b></label>
             <input type="date" name="check-out date" id="check-out date" required>
             <br><br>
         
             <label for="room type"><b>Room Type: </b></label>
             <select name="room type" id="room type" required>

             <option value="Single Room"> Single Room:</option>
             <option value="Double Room"> Double Room:</option>
             </select>
             <br><br>

             <label for="number of guests"><b>Number of Guests: </b></label>
             <input type="number" name="number of guests" id="number of guests" placeholder="" required>
             <br><br>

 
             <label for="special requests"><b>Special Requests: </b></label> <br>
             
            <textarea name="Special requests" id=""></textarea>
            <br><br>

            
            <button> <b> Book Now </b></button>  <button><b>Reset Form </b></button>
 



        </form>




    </fieldset>
    </center>
</body>
</html>
